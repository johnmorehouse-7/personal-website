<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- One irregular closed contour, centered on (0,0). Reused at increasing
         scale to form concentric "elevation" rings. -->
    <path id="ring" d="M 0,-50 C 30,-52 58,-24 50,8 C 44,38 18,58 -12,50 C -42,42 -58,14 -50,-16 C -44,-44 -26,-48 0,-50 Z"/>
    <g id="peak">
      <use href="#ring" transform="scale(0.5)"/>
      <use href="#ring" transform="scale(1.0)"/>
      <use href="#ring" transform="scale(1.6)"/>
      <use href="#ring" transform="scale(2.3)"/>
      <use href="#ring" transform="scale(3.1)"/>
      <use href="#ring" transform="scale(4.0)"/>
      <use href="#ring" transform="scale(5.0)"/>
      <use href="#ring" transform="scale(6.1)"/>
    </g>
  </defs>
  <g fill="none" stroke="#b9b09e" stroke-width="1.4">
    <use href="#peak" transform="translate(300 250)"/>
    <use href="#peak" transform="translate(880 520) scale(1.1)"/>
    <use href="#peak" transform="translate(700 130) scale(0.7)"/>
  </g>
</svg>
